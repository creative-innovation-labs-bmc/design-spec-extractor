name: Install Design Spec Extractor package

on:
  push:
    paths:
      - payload/ready

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: install-design-spec-extractor
  cancel-in-progress: false

jobs:
  install:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct and extract package
        shell: bash
        run: |
          set -euo pipefail
          cat payload/part-* > /tmp/design-spec-extractor.b64
          base64 --decode /tmp/design-spec-extractor.b64 > /tmp/design-spec-extractor.zip
          unzip -t /tmp/design-spec-extractor.zip
          mkdir -p /tmp/design-spec-extractor
          unzip -q /tmp/design-spec-extractor.zip -d /tmp/design-spec-extractor

      - name: Replace starter project
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/design-spec-extractor/. .

      - name: Run smoke test
        run: node tests/smoke-test.mjs

      - name: Commit completed project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install Design Spec Extractor"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
