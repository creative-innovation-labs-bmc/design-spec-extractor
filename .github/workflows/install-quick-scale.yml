name: Install quick scale control

on:
  push:
    paths:
      - .quick-scale-install
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add quick scale script to page
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          content = path.read_text(encoding='utf-8')
          script = '  <script src="js/quick-scale.js" defer></script>\n'
          if 'js/quick-scale.js' not in content:
              content = content.replace('</body>', script + '</body>')
              path.write_text(content, encoding='utf-8')
          PY

      - name: Remove installer files
        run: |
          rm -f .quick-scale-install
          rm -f .github/workflows/install-quick-scale.yml

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/quick-scale.js .quick-scale-install .github/workflows/install-quick-scale.yml
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Add quick scale header control"
            git push
          fi
